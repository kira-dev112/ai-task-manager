name: taskmanager
services:
  #база данных
  postgres:
    image: postgres:16-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newpass123
      POSTGRES_DB: task_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  #backend
  backend:
    build: ./backend
    container_name: task_manager_backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:newpass123@postgres:5432/task_manager
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped
  #frontend
  frontend:
    build: ./frontend
    container_name: task_manager_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data: